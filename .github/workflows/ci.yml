name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Secret scan before deps are installed, so the working tree is just
      # source. Pinned binary (verified against the release checksum) keeps
      # this self-contained -- no marketplace action, no org license key.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Download under the UPSTREAM filename: the checksums file lists that
          # name, and `sha256sum -c` resolves the name from the line it is given
          # rather than the file it was handed. Renaming on download made the
          # check look for a file that did not exist, which failed as a missing
          # file rather than a checksum mismatch.
          curl -fsSL -O "${base}/${tarball}"
          curl -fsSL -o gitleaks.checksums "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "${tarball}" gitleaks.checksums | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks dir . --no-banner --redact
          rm -f gitleaks "${tarball}" gitleaks.checksums

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  # Dependency vulnerabilities. One tool covers this repo's pnpm lockfile and
  # the Python repos' poetry.lock alike, so the gate reads the same everywhere.
  #
  # Why the pinned CLI and not google/osv-scanner-action: that action ships
  # REUSABLE WORKFLOWS whose `upload-sarif` input defaults to true, which needs
  # `security-events: write` plus GitHub code scanning -- not available for
  # private repos on a free plan. Calling the pinned binary keeps one pattern
  # that works on public and private repos alike, and keeps this job on
  # `contents: read`.
  #
  # Pin + verify the checksum before running, so a tampered release artifact
  # fails the job rather than executing.
  osv-scan:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install osv-scanner
        env:
          OSV_VERSION: 2.5.1
        run: |
          set -euo pipefail
          BASE="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl -sSfL -o /tmp/osv-scanner    "${BASE}/osv-scanner_linux_amd64"
          curl -sSfL -o /tmp/osv_SHA256SUMS "${BASE}/osv-scanner_SHA256SUMS"
          # The checksums file names the upstream artifact, so verify under
          # that name before renaming it into place.
          ( cd /tmp && cp osv-scanner osv-scanner_linux_amd64 \
            && grep ' osv-scanner_linux_amd64$' osv_SHA256SUMS | sha256sum --check --status )
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      # `-r .` walks the tree and picks up every lockfile it recognises.
      # Exits non-zero on a finding.
      - name: Scan lockfiles
        run: osv-scanner scan source -r .
