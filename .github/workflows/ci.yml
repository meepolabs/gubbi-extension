name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel redundant runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  secret-scan:
    name: secret scan
    uses: ./.github/workflows/gitleaks.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  # The single context branch protection requires. Every other job in this
  # file must be listed under `needs:`; the completeness check runs here, not
  # only inside `verify`, so dropping a lane from `needs:` cannot also drop
  # the check. `always()` makes it report even when a dependency fails or is
  # skipped, so a missing lane reads as red rather than as pending.
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - verify
      - secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: needs checker tests
        run: node --test scripts/verify-required-needs.test.mjs

      - name: needs lists every other job
        run: node scripts/verify-required-needs.mjs .github/workflows/ci.yml

      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          echo "dependency results: $RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "required: at least one job did not succeed" >&2
            exit 1
          fi
          printf '%s' "$RESULTS" | grep -q '"success"' || { echo "required: no results" >&2; exit 1; }
