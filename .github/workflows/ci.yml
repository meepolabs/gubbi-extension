name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel redundant runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  # Dependency vulnerabilities. One tool covers this repo's pnpm lockfile and
  # the Python repos' poetry.lock alike, so the gate reads the same everywhere.
  #
  # Why the pinned CLI and not google/osv-scanner-action: that action ships
  # REUSABLE WORKFLOWS whose `upload-sarif` input defaults to true, which needs
  # `security-events: write` plus GitHub code scanning -- not available for
  # private repos on a free plan. Calling the pinned binary keeps one pattern
  # that works on public and private repos alike, and keeps this job on
  # `contents: read`.
  #
  # Pin + verify the checksum before running, so a tampered release artifact
  # fails the job rather than executing.
  osv-scan:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install osv-scanner
        env:
          # OSV_VERSION and OSV_SHA256 must change together. Renovate bumps
          # OSV_VERSION but cannot compute a release asset digest, so a bump
          # PR fails this step until OSV_SHA256 is set by hand to the sha256
          # of osv-scanner_linux_amd64 for the new release (compute it from
          # the downloaded asset and cross-check the release SHA256SUMS).
          OSV_VERSION: 2.5.1
          OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
        run: |
          set -euo pipefail
          BASE="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl -sSfL -o /tmp/osv-scanner "${BASE}/osv-scanner_linux_amd64"
          # Verify against the committed digest, not the release SHA256SUMS:
          # that file is served from the same release as the binary, so it
          # cannot vouch for it.
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum --check
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      # `-r .` walks the tree and picks up every lockfile it recognises.
      # Exits non-zero on a finding.
      - name: Scan lockfiles
        run: osv-scanner scan source -r .
