# Not a multi-package repo: this file exists only as pnpm's per-project config
# file, which is the sole home for these settings. Omitting `packages:` keeps
# the root as the only package.

# Supply-chain delay: pnpm refuses versions published less than 14 days ago
# (minutes), including transitive deps that Renovate's own release-age check
# never sees. To ship an urgent security fix sooner, temporarily list the
# package (or an exact `name@version`) under `minimumReleaseAgeExclude` and
# remove the entry once the version is 14 days old. Packages released together
# with the fix and pinned exactly by it (often a whole scope) must be excluded
# too, e.g. `typescript-eslint` plus `@typescript-eslint/*`.
minimumReleaseAge: 20160

# Every build script in the tree must be listed. pnpm 11 defaults
# `strictDepBuilds` to true, so an unlisted one fails the install rather than
# warning.
allowBuilds:
  esbuild: true
  # A child_process.spawnSync polyfill, reached transitively through the build
  # tooling. Its postinstall shells out to `npm install` to add a native
  # thread-sleep dependency, and only on runtimes predating spawnSync -- so on
  # this package's Node floor it has nothing to do.
  spawn-sync: false

# Security floors for advisories upstream has not shipped a fix for.
#
# Every one of these reaches the tree through BUILD/DEV tooling (wxt's
# browser-launch stack, vite, postcss, eslint). The two dependencies that ship
# inside the packaged extension are clean, so nothing vulnerable reaches a
# user -- that bounds the blast radius to dev machines and CI, it does not make
# the advisories ignorable.
#
# Preferred fix is always bumping the direct parent. That is unavailable here:
# the shell-quote/tmp/adm-zip chain arrives via wxt -> web-ext-run (tmp
# directly, shell-quote through fx-runner, adm-zip through firefox-profile), and
# web-ext-run's newest release (0.2.4) still depends on the vulnerable
# fx-runner, so there is no parent version to move to.
#
# Each floor carries its advisory ID and a review date. An override left in
# place after upstream fixes the issue silently blocks future minor upgrades,
# so these are due for a re-check -- delete any whose parent has since bumped.
# Review: 2027-02-28.
overrides:
  # GHSA-w7jw-789q-3m8p (critical: quote() does not escape newlines),
  # GHSA-395f-4hp3-45gv. Via fx-runner; no fixed parent exists.
  shell-quote@<1.8.4: ">=1.8.4"
  # GHSA-ph9p-34f9-6g65 (path traversal via unsanitized prefix/postfix).
  tmp@<0.2.6: ">=0.2.6"
  # GHSA-xcpc-8h2w-3j85 (crafted ZIP triggers a 4GB allocation),
  # GHSA-7q85-xj36-vmfc (DoS), GHSA-vwc7-r8mq-g2x9 (extraction follows
  # destination symlinks; 0.6.1 rejects writes through them).
  adm-zip@<0.6.1: ">=0.6.1"
  # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8. Scoped at 3.x and up: nanoid
  # resolves several majors in this tree and a bare key would coerce them all.
  nanoid@<3.3.16: ">=3.3.16"
  # GHSA-fxqj-rqcc-2cmp, GHSA-r28c-9q8g-f849.
  postcss@<8.5.23: ">=8.5.23"
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr (DoS in
  # brace expansion). Two copies resolve: 1.x via minimatch@3.1.5 (multimatch
  # <- web-ext-run <- wxt) and 5.x via minimatch 10 (eslint). Each floor is
  # keyed to one major and its value is capped inside that major, because
  # coercing across majors breaks minimatch: 5.x exports a named `expand`
  # where 1.x exported a default, and minimatch@3.1.5 then throws
  # `TypeError: expand is not a function`. Verified by requiring each
  # minimatch copy after the relock. Both copies are dev tooling only; neither
  # ships in the packaged extension.
  brace-expansion@1: ">=1.1.21 <2"
  brace-expansion@5: ">=5.0.12 <6"
  # GHSA-g7r4-m6w7-qqqr (low; dev server request handling).
  esbuild@<0.28.1: ">=0.28.1"
  # GHSA-w5hq-g745-h8pq (moderate).
  uuid@<11.1.1: ">=11.1.1"
